# Static site: no build step. Netlify serves the repository root as-is.
[build]
  publish = "."
  command = ""

# Live inventory lookups for the page's own JavaScript. Shopify sends no CORS
# headers, so the browser reads the store's public JSON through this same-origin proxy.
# Keep the store address in step with STORE in scripts/sync-shopify.mjs.
[[redirects]]
  from = "/shopify/*"
  to = "https://maudeonmain.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
